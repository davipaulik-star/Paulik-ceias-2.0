<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avisos — Painel administrativo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<script>const BASE = "../";</script>
</head>
<body class="admin-body">
<header id="admin-header"></header>
<main class="admin-main">
  <div class="admin-page-head">
    <div>
      <h1 id="crud-title" style="margin-bottom:4px">Avisos</h1>
      <p class="muted" id="crud-intro"></p>
    </div>
    <button class="btn btn-primary" id="crud-new-btn">+ Novo aviso</button>
  </div>
  <div class="admin-card" id="crud-list"></div>
</main>

<div class="modal" id="crud-form-modal">
  <div class="modal-box">
    <h2 id="crud-form-title">Nova entrada</h2>
    <form id="crud-form">
      <div id="crud-form-fields"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="crud-form-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="crud-form-submit">Publicar</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/helpers.js"></script>
<script src="../assets/js/github-api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="admin-common.js"></script>
<script src="crud.js"></script>
<script>
  initCrudPage({
    key: "avisos",
    title: "Avisos",
    intro: "Comunicados de prioridade alta, média ou baixa exibidos na Home.",
    dataFile: "data/notices.json",
    sortKey: "date",
    titleKey: "title",
    listColumns: [
      { key: "title", label: "Título" },
      { key: "priority", label: "Prioridade" },
      { key: "date", label: "Data", type: "date" },
      { key: "expirationDate", label: "Expira em", type: "date" },
    ],
    fields: [
      { key: "title", label: "Título", type: "text", required: true },
      { key: "message", label: "Mensagem", type: "textarea", required: true },
      { key: "date", label: "Data", type: "date", required: true },
      { key: "priority", label: "Prioridade", type: "select", options: ["alta", "media", "baixa"], default: "media" },
      { key: "image", label: "Imagem (opcional)", type: "image" },
      { key: "link", label: "Link (opcional)", type: "url" },
      { key: "expirationDate", label: "Data de expiração (opcional)", type: "date" },
    ],
  });
</script>
</body>
</html>
