<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contato — Colégio Estadual do Campo Irmã Ambrosia Sabatovish</title>
<meta name="description" content="Entre em contato com o Colégio Estadual do Campo Irmã Ambrosia Sabatovish: endereço, telefone, e-mail e formulário.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>const BASE = "";</script>
</head>
<body>
<a href="#main" class="skip-link">Pular para o conteúdo</a>
<header id="site-header"></header>
<main id="main">
  <section class="page-hero">
    <div class="container">
      <h1>Contato</h1>
      <p>Fale com a nossa secretaria ou visite o colégio.</p>
    </div>
  </section>
  <section class="section">
    <div class="container contact-grid">
      <div>
        <ul class="contact-info" style="list-style:none;padding:0">
          <li><strong>Endereço:</strong>&nbsp;<span id="contact-address"></span></li>
          <li><strong>Telefone:</strong>&nbsp;<a id="contact-phone" href="#"></a></li>
          <li><strong>E-mail:</strong>&nbsp;<a id="contact-email" href="#"></a></li>
          <li><strong>Atendimento:</strong>&nbsp;<span id="contact-hours"></span></li>
        </ul>
        <h3>Redes sociais</h3>
        <ul id="contact-social" style="list-style:none;padding:0"></ul>
        <h3 style="margin-top:28px">Localização</h3>
        <div id="contact-map"></div>
      </div>
      <div class="card">
        <h3>Envie uma mensagem</h3>
        <form id="contact-form">
          <label class="field"><span>Nome</span><input type="text" name="name" required></label>
          <label class="field"><span>E-mail</span><input type="email" name="email" required></label>
          <label class="field"><span>Assunto</span><input type="text" name="subject" required></label>
          <label class="field"><span>Mensagem</span><textarea name="message" rows="5" required></textarea></label>
          <button type="submit" class="btn btn-primary">Enviar mensagem</button>
          <p class="hint" id="contact-form-note" style="margin-top:10px"></p>
          <p id="contact-feedback" role="status"></p>
        </form>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/helpers.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/page-contato.js"></script>
</body>
</html>
